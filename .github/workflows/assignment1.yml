name: assignment1

on:
  pull_request:
    paths:
      - 'assignment1/**'
      - '!assignment1/**.md'
      - '!assignment1/evidence/**'
      - '.github/workflows/assignment1.yml'
  push:
    branches: [main]
    paths:
      - 'assignment1/**'
      - '!assignment1/**.md'
      - '!assignment1/evidence/**'
      - '.github/workflows/assignment1.yml'

permissions:
  contents: read

concurrency:
  group: assignment1
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
      - run: terraform fmt -check -recursive assignment1/terraform
      - run: |
          for env in dev staging prod; do
            terraform -chdir=assignment1/terraform/$env init -backend=false -input=false
            terraform -chdir=assignment1/terraform/$env validate
          done

  plan-staging:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: assignment1/terraform/staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false

  apply-staging:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: assignment1/terraform/staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-staging
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: assignment1/terraform/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
